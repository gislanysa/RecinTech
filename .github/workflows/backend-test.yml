name: backend-test

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/src/**"
      - "backend/test/**"
      - ".github/workflows/backend-test.yml"
  pull_request:
    paths:
      - "backend/src/**"
      - "backend/test/**"
      - ".github/workflows/backend-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Database
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: aluno
          POSTGRES_PASSWORD: "123"
          POSTGRES_DB: senac
        options: >-
          --health-cmd "pg_isready -U aluno -d senac" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432

    # Environment variables
    env:
      DATABASE_URL: postgres://aluno:123@localhost:5432/senac
      SECRET_KEY: senac

    # Running unit tests
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "v1.19.0"
          rebar3-version: "3"

      # It needs a C compiler because of the Argon2 hashing.
      - name: install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: build backend
        run: gleam build

      - name: build database tables
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f postgres/00_tables.sql

      - name: run unit tests
        run: gleam test

      - name: check formatting
        run: gleam format --check src test
