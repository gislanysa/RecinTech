      summary: Update information about a startup.
      description: Update information about a startup. Missing fields and empty strings are ignored.
      operationId: patchApiStartupById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
