openapi: 3.0.4
info:
  title: RecinTech API
  description: API do backend (Gleam) da plataforma que conecta startups e empresas. Gerado a partir de
    docs/api.md; os schemas são inferidos dos exemplos de resposta.
  version: 0.1.0
servers:
- url: http://localhost:8000
  description: Desenvolvimento local (ajuste a porta)
paths:
  /api/healthcheck:
    get:
      tags:
      - health
      summary: Check if the HTTP server is running correctly.
      operationId: getApiHealthcheck
      responses:
        '200':
          description: Successful
  /:
    get:
      tags:
      - client
      summary: Serve the HTML document for the client-side application.
      description: Serve the HTML document for the client-side application. Any unknown non-API route
        falls back to this document.
      operationId: getRoot
      responses:
        '200':
          description: Successful. The application's HTML document.
  /api/auth/login:
    post:
      tags:
      - auth
      summary: Authenticate a startup or a company.
      description: Authenticate a startup or a company. On success, a signed `SESSION` cookie is set on
        the response, lasting exactly one hour. The response body contains startup or company data, depending
        on the session type.
      operationId: postApiAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session:
                  type: string
                  enum:
                  - startup
                  - company
                email:
                  type: string
                password:
                  type: string
              required:
              - session
              - email
              - password
            example:
              session: startup
              email: wibble@email.com
              password: '12345678'
        description: '`session`: either `"startup"` or `"company"`'
      responses:
        '200':
          description: Successful. The startup or company object for the authenticated account, e.g.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  email:
                    type: string
                  stage:
                    type: string
                  cnpj:
                    type: string
                  description:
                    type: string
                  city:
                    type: string
                  state:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                  is_active:
                    type: boolean
                  website:
                    type: string
                required:
                - id
                - name
                - email
                - stage
                - cnpj
                - description
                - city
                - state
                - created_at
                - updated_at
                - is_active
                - website
              example:
                id: 01a058ae-057f-73e8-b2a0-50986559767b
                name: Critic Level
                email: critic@email.dev
                stage: traction
                cnpj: '12345678901234'
                description: startup muito maneira
                city: Recife
                state: Pernambuco
                created_at: '2026-09-14T20:08:02.000Z'
                updated_at: '2026-09-14T20:08:02.000Z'
                is_active: true
                website: criticlevel.dev
        '400':
          description: Invalid JSON, invalid email format or invalid session type
        '401':
          description: Wrong email or password
  /api/auth/logout:
    post:
      tags:
      - auth
      summary: Deletes the session cookie stored in the user request.
      operationId: postApiAuthLogout
      responses:
        '204':
          description: Successful
        '401':
          description: Missing cookie
      security:
      - cookieAuth: []
  /api/auth/restore:
    get:
      tags:
      - auth
      summary: Check for an active session token and restore it.
      description: Check for an active session token and restore it. On success, the server sends startup
        or company data, depending on the session type. This route does **not** refresh the session token
        duration. Requires the `SESSION` cookie.
      operationId: getApiAuthRestore
      responses:
        '200':
          description: Successful. The startup or company object for the active session.
        '401':
          description: Missing session cookie
        '404':
          description: Startup or Company not found
      security:
      - cookieAuth: []
  /api/auth/refresh:
    get:
      tags:
      - auth
      summary: Refresh the duration of the current session token.
      description: Refresh the duration of the current session token. Requires the `SESSION` cookie.
      operationId: getApiAuthRefresh
      responses:
        '204':
          description: Successful
        '401':
          description: Missing session cookie
      security:
      - cookieAuth: []
  /api/startup:
    post:
      tags:
      - startup
      summary: Register a new startup.
      operationId: postApiStartup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                cnpj:
                  type: string
                stage:
                  type: string
                  enum:
                  - traction
                  - scaling
                description:
                  type: string
                city:
                  type: string
                state:
                  type: string
                website:
                  type: string
              required:
              - name
              - email
              - password
              - cnpj
              - stage
              - description
              - city
              - state
              - website
            example:
              name: Recintech
              email: recintech@email.com
              password: '12345678'
              cnpj: '12345678901234'
              stage: traction
              description: startup muito maneira
              city: Recife
              state: Pernambuco
              website: recintech.dev
        description: '`stage`: either `"traction"` or `"scaling"`'
      responses:
        '201':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  email:
                    type: string
                  stage:
                    type: string
                  cnpj:
                    type: string
                  description:
                    type: string
                  city:
                    type: string
                  state:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                  is_active:
                    type: boolean
                  website:
                    type: string
                required:
                - id
                - name
                - email
                - stage
                - cnpj
                - description
                - city
                - state
                - created_at
                - updated_at
                - is_active
                - website
              example:
                id: 01a058ae-057f-73e8-b2a0-50986559767b
                name: Critic Level
                email: critic@email.dev
                stage: traction
                cnpj: '12345678901234'
                description: startup muito maneira
                city: Recife
                state: Pernambuco
                created_at: '2026-09-14T20:08:02.000Z'
                updated_at: '2026-09-14T20:08:02.000Z'
                is_active: true
                website: criticlevel.dev
        '400':
          description: Invalid JSON or invalid data
        '409':
          description: Duplicated email or CNPJ
    get:
      tags:
      - startup
      summary: Fetch a list of registered startups.
      operationId: getApiStartup
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    email:
                      type: string
                    stage:
                      type: string
                    cnpj:
                      type: string
                    description:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
                    is_active:
                      type: boolean
                    website:
                      type: string
                  required:
                  - id
                  - name
                  - email
                  - stage
                  - cnpj
                  - description
                  - city
                  - state
                  - created_at
                  - updated_at
                  - is_active
                  - website
              example:
              - id: 01a058ae-057f-73e8-b2a0-50986559767b
                name: Critic Level
                email: wibble@email.com
                stage: traction
                cnpj: '12345678901234'
                description: startup muito maneira
                city: Recife
                state: Pernambuco
                created_at: '2026-09-14T20:08:02.000Z'
                updated_at: '2026-09-14T20:08:02.000Z'
                is_active: true
                website: wibble.com
              - id: 01a0dbb3-153a-7b84-8c3d-631788972d4a
                name: Virada no Cafe
                email: wobble@email.com
                stage: scaling
                cnpj: '12345678901234'
                description: bem legal
                city: Recife
                state: Pernambuco
                created_at: '2025-09-14T20:08:02.000Z'
                updated_at: '2026-09-14T20:08:02.000Z'
                is_active: true
                website: wobble.com
        '400':
          description: Missing, invalid or incomplete query parameters
  /api/startup/{id}:
    patch:
      tags:
