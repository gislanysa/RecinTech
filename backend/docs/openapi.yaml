  /api/startup/{id}/application:
    post:
      tags:
      - startup
      summary: Apply to an open demand.
      description: Apply to an open demand. A startup can have at most one application per demand. A Startup
        session is required, and it must belong to the startup identified by `id`.
      operationId: postApiStartupByIdApplication
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: the startup's ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                demand:
                  type: string
                  format: uuid
              required:
              - demand
            example:
              demand: 01a173cb-9533-7ebd-87a0-590965ef3653
      responses:
        '201':
          description: 'Successful. - `status`: one of `"pending"`, `"accepted"` or `"declined"`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  demand:
                    type: string
                    format: uuid
                  startup:
                    type: string
                    format: uuid
                  status:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                required:
                - demand
                - startup
                - status
                - created_at
                - updated_at
              example:
                demand: 01a173cb-9533-7ebd-87a0-590965ef3653
                startup: 01a173cb-9533-7eb5-9522-9686fef4f2a4
                status: pending
                created_at: '2026-09-14T20:08:02.000Z'
                updated_at: '2026-09-14T20:08:02.000Z'
        '400':
          description: Invalid JSON, invalid UUID format, or demand is not open
        '401':
          description: Not authenticated
        '403':
          description: Invalid session
        '404':
          description: Demand not found
        '409':
          description: The startup already applied to the demand
      security:
      - cookieAuth: []
