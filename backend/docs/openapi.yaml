  /api/startup/{id}/lgpd:
    get:
      tags:
      - startup
      summary: Fetch all LGPD (Lei Geral de Proteção de Dados) consent records for a startup, ordered
        by policy version.
      operationId: getApiStartupByIdLgpd
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: the startup's ID.
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    subject:
                      type: object
                      properties:
                        type:
                          type: string
                        id:
                          type: string
                          format: uuid
                      required:
                      - type
                      - id
                    updated_at:
                      type: string
                      format: date-time
                    version:
                      type: integer
                  required:
                  - type
                  - subject
                  - updated_at
                  - version
              example:
              - type: granted
                subject:
                  type: startup
                  id: 01a058ae-057f-73e8-b2a0-50986559767b
                updated_at: '2026-09-14T20:08:02.000Z'
                version: 1
              - type: revoked
                subject:
                  type: startup
                  id: 01a058ae-057f-73e8-b2a0-50986559767b
                updated_at: '2026-09-14T20:08:02.000Z'
                version: 2
        '400':
          description: Invalid UUID format
        '500':
          description: Failed to fetch consent records
  /api/startup/{id}/lgpd/{version}:
    post:
      tags:
      - startup
      summary: Grant LGPD (Lei Geral de Proteção de Dados) consent for a startup at a given policy version.
      description: Grant LGPD (Lei Geral de Proteção de Dados) consent for a startup at a given policy
        version. Once granted, the startup allows its data to be used as described by that version of
        the privacy policy. A Startup session is required.
      operationId: postApiStartupByIdLgpdByVersion
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: the startup's ID.
      - name: version
        in: path
        required: true
        schema:
          type: integer
        description: the accepted policy version. Must be greater than
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  subject:
                    type: object
                    properties:
                      type:
                        type: string
                      id:
                        type: string
                        format: uuid
                    required:
                    - type
                    - id
                  updated_at:
                    type: string
                    format: date-time
                  version:
                    type: integer
                required:
                - type
                - subject
                - updated_at
                - version
              example:
                type: granted
                subject:
                  type: startup
                  id: 01a058ae-057f-73e8-b2a0-50986559767b
                updated_at: '2026-09-14T20:08:02.000Z'
                version: 1
        '400':
          description: Invalid UUID format or invalid policy version
        '401':
          description: Not authenticated
        '403':
          description: Invalid session
        '404':
          description: Startup not found
        '500':
          description: Failed to update consent
      security:
      - cookieAuth: []
    delete:
      tags:
      - startup
      summary: Revoke LGPD (Lei Geral de Proteção de Dados) consent for a startup at a given policy version.
      description: Revoke LGPD (Lei Geral de Proteção de Dados) consent for a startup at a given policy
        version. Once revoked, the startup no longer allows its data to be used as described by that version
        of the privacy policy. A Startup session is required.
      operationId: deleteApiStartupByIdLgpdByVersion
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: the startup's ID.
      - name: version
        in: path
        required: true
        schema:
          type: integer
        description: the revoked policy version. Must be greater than
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  subject:
                    type: object
                    properties:
                      type:
                        type: string
                      id:
                        type: string
                        format: uuid
                    required:
                    - type
                    - id
                  updated_at:
                    type: string
                    format: date-time
                  version:
                    type: integer
                required:
                - type
                - subject
                - updated_at
                - version
              example:
                type: revoked
                subject:
                  type: startup
                  id: 01a058ae-057f-73e8-b2a0-50986559767b
                updated_at: '2026-09-14T20:08:02.000Z'
                version: 1
        '400':
          description: Invalid UUID format or invalid policy version
        '401':
          description: Not authenticated
        '403':
          description: Invalid session
        '404':
          description: Startup not found
        '500':
          description: Failed to update consent
      security:
      - cookieAuth: []
