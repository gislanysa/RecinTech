              email: contact@viradanocafe.com
              stage: scaling
              cnpj: '12345678901234'
              description: Inovacao periferica que transforma
              city: Olinda
              state: Pernambuco
              website: https://viradanocafe.com
        description: 'All fields are optional. `stage`: either `"traction"` or `"scaling"`. Empty strings
          are treated as missing fields.'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  email:
                    type: string
                  stage:
                    type: string
                  cnpj:
                    type: string
                  description:
                    type: string
                  city:
                    type: string
                  state:
                    type: string
                  created_at:
                    type: string
                    format: date-time
